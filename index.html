<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>8068 CAR SQUARE | POS System v8.8.7</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #0a0a0a;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 10px;
        }
        .neon-glow {
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
        }
        .neon-border {
            border: 1px solid #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
        }
        .btn-neon {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            transition: all 0.2s;
        }
        .btn-neon:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px #00d4ff;
        }
        .card-premium {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 1rem;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 1rem;
            padding: 1.5rem;
            max-width: 1100px;
            width: 95%;
            border: 1px solid #00d4ff;
            max-height: 85vh;
            overflow-y: auto;
        }
        .commission-badge {
            background: linear-gradient(135deg, #00d4ff20, #0077b620);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .editable-field {
            cursor: pointer;
            transition: all 0.2s;
        }
        .editable-field:hover {
            background: rgba(0, 212, 255, 0.15);
            border-radius: 8px;
            padding: 2px 6px;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
        }
        .admin-sidebar {
            background: rgba(10, 10, 10, 0.95);
            border-right: 1px solid #00d4ff;
            border-radius: 1rem 0 0 1rem;
            padding: 20px;
        }
        .admin-sidebar-item {
            padding: 10px 14px;
            margin: 4px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .admin-sidebar-item:hover {
            background: rgba(0, 212, 255, 0.1);
        }
        .admin-sidebar-item.active {
            background: rgba(0, 212, 255, 0.2);
            border-left: 3px solid #00d4ff;
        }
        .admin-content {
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .action-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 2px;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .excel-export-btn {
            background: linear-gradient(135deg, #217346, #1a6e3a);
            transition: all 0.2s;
        }
        .excel-export-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(33, 115, 70, 0.5);
        }
        .pdf-export-btn {
            background: linear-gradient(135deg, #dc3545, #b02a37);
            transition: all 0.2s;
        }
        .pdf-export-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.5);
        }
        .csv-export-btn {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            transition: all 0.2s;
        }
        .csv-export-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.5);
        }
        .status-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }
        .status-pending {
            background: #ffaa0033;
            color: #ffaa00;
        }
        .status-in-progress {
            background: #00d4ff33;
            color: #00d4ff;
        }
        .status-completed {
            background: #00ff8833;
            color: #00ff88;
        }
        .status-paid {
            background: #8888ff33;
            color: #8888ff;
        }
        .credit-badge {
            background: #ff6b0033;
            color: #ff6b00;
        }

        /* ===== RECEIPT — 80mm OPTIMIZED ===== */
        .receipt-80mm {
            width: 80mm;
            margin: 0 auto;
            padding: 10px 12px;
            background: white;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            box-sizing: border-box;
        }
        .receipt-80mm .center {
            text-align: center;
        }
        .receipt-80mm .line {
            border-top: 1px dashed #000;
            margin: 6px 0;
        }
        .receipt-80mm .bold {
            font-weight: 700;
        }
        .receipt-80mm .total {
            font-size: 20px;
            font-weight: 700;
        }
        .receipt-80mm .item .name {
            display: inline-block;
            width: 68%;
            font-size: 13px;
        }
        .receipt-80mm .item .price {
            display: inline-block;
            width: 32%;
            text-align: right;
            font-size: 13px;
        }
        .receipt-80mm .header-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .receipt-80mm .sub-text {
            font-size: 13px;
        }
        .receipt-80mm .thankyou {
            font-size: 15px;
            font-weight: 700;
            margin-top: 6px;
        }
        .receipt-80mm .small {
            font-size: 11px;
            color: #555;
        }
        .receipt-80mm .qr-code-container {
            display: flex;
            justify-content: center;
            margin: 8px 0;
            padding: 4px;
            background: white;
            border-radius: 4px;
        }
        .receipt-80mm .qr-code-container canvas,
        .receipt-80mm .qr-code-container img {
            max-width: 100%;
            height: auto;
        }
        .receipt-80mm .receipt-copy-label {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            border-top: 1px dashed #ccc;
            padding-top: 6px;
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .receipt-80mm .cut-marker {
            display: block;
            text-align: center;
            font-size: 11px;
            color: #666;
            padding: 6px 0;
            border-top: 2px dashed #666;
            border-bottom: 2px dashed #666;
            margin: 6px 0;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .receipt-80mm .receipt-customer .receipt-copy-label {
            color: #00b4d8;
        }
        .receipt-80mm .receipt-shop .receipt-copy-label {
            color: #ff6b6b;
        }

        /* ===== RECEIPT — 58mm (fallback) ===== */
        .receipt-58mm {
            width: 58mm;
            margin: 0 auto;
            padding: 6px 8px;
            background: white;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.4;
            box-sizing: border-box;
        }
        .receipt-58mm .center {
            text-align: center;
        }
        .receipt-58mm .line {
            border-top: 1px dashed #000;
            margin: 4px 0;
        }
        .receipt-58mm .bold {
            font-weight: 700;
        }
        .receipt-58mm .total {
            font-size: 15px;
            font-weight: 700;
        }
        .receipt-58mm .item .name {
            display: inline-block;
            width: 68%;
            font-size: 10px;
        }
        .receipt-58mm .item .price {
            display: inline-block;
            width: 32%;
            text-align: right;
            font-size: 10px;
        }
        .receipt-58mm .header-text {
            font-size: 14px;
            font-weight: 700;
        }
        .receipt-58mm .sub-text {
            font-size: 10px;
        }
        .receipt-58mm .thankyou {
            font-size: 12px;
            font-weight: 700;
            margin-top: 4px;
        }
        .receipt-58mm .qr-code-container {
            display: flex;
            justify-content: center;
            margin: 6px 0;
            padding: 4px;
            background: white;
            border-radius: 4px;
        }
        .receipt-58mm .qr-code-container canvas,
        .receipt-58mm .qr-code-container img {
            max-width: 100%;
            height: auto;
        }
        .receipt-58mm .receipt-copy-label {
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            border-top: 1px dashed #ccc;
            padding-top: 4px;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .receipt-58mm .cut-marker {
            display: block;
            text-align: center;
            font-size: 9px;
            color: #666;
            padding: 4px 0;
            border-top: 2px dashed #666;
            border-bottom: 2px dashed #666;
            margin: 4px 0;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* ===== AI ASSISTANT ===== */
        .ai-assistant-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        .ai-assistant-container.hidden {
            display: none !important;
        }
        .ai-assistant-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0077b6);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .ai-assistant-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(0, 212, 255, 0.6);
        }
        .ai-assistant-toggle .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.3);
            animation: pulse-ring 2s ease-out infinite;
        }
        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }
        .ai-assistant-window {
            width: 380px;
            max-width: 90vw;
            max-height: 500px;
            background: rgba(10, 10, 10, 0.97);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 16px;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .ai-assistant-window.open {
            display: flex;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .ai-assistant-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 212, 255, 0.05);
        }
        .ai-assistant-header h4 {
            font-size: 14px;
            font-weight: 600;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ai-assistant-header h4 i {
            font-size: 18px;
        }
        .ai-assistant-header .close-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }
        .ai-assistant-header .close-btn:hover {
            color: #fff;
        }
        .ai-assistant-chat {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            max-height: 320px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ai-message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 90%;
            font-size: 13px;
            line-height: 1.5;
            animation: messageIn 0.3s ease-out;
        }
        @keyframes messageIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .ai-message.user {
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.15);
            align-self: flex-end;
            color: #fff;
        }
        .ai-message.assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            align-self: flex-start;
            color: #ddd;
        }
        .ai-message.assistant .highlight {
            color: #00d4ff;
            font-weight: 600;
        }
        .ai-message.assistant .highlight-green {
            color: #00ff88;
            font-weight: 600;
        }
        .ai-message.assistant .highlight-yellow {
            color: #ffaa00;
            font-weight: 600;
        }
        .ai-message.assistant .highlight-red {
            color: #ff6b6b;
            font-weight: 600;
        }
        .ai-message.assistant .stat-block {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 4px 0;
            border-left: 2px solid #00d4ff;
        }
        .ai-message.assistant .stat-block .label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
        }
        .ai-message.assistant .stat-block .value {
            font-weight: 600;
            font-size: 15px;
        }
        .ai-assistant-input {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.3);
        }
        .ai-assistant-input input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .ai-assistant-input input:focus {
            border-color: #00d4ff;
        }
        .ai-assistant-input input::placeholder {
            color: #555;
        }
        .ai-assistant-input button {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ai-assistant-input button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        .ai-assistant-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .ai-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px 14px 8px;
        }
        .ai-suggestions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 10px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .ai-suggestions button:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 6px 0;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #555;
            border-radius: 50%;
            animation: typing 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }
        @media (max-width: 480px) {
            .ai-assistant-window {
                width: 100vw;
                max-width: 100vw;
                max-height: 80vh;
                bottom: 0;
                right: 0;
                border-radius: 16px 16px 0 0;
                position: fixed;
                bottom: 0;
                right: 0;
                left: 0;
            }
            .ai-assistant-container {
                bottom: 10px;
                right: 10px;
            }
            .ai-assistant-toggle {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
        }

        /* ===== FEEDBACK FORM ===== */
        .feedback-form .form-group {
            margin-bottom: 14px;
        }
        .feedback-form .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            width: 100%;
            transition: all 0.3s;
        }
        .feedback-form .form-control:focus {
            border-color: #00d4ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }
        .feedback-form .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .feedback-form .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
        }
        .feedback-form .btn-submit {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .feedback-form .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 180, 216, 0.3);
        }
        .feedback-form .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .feedback-form .btn-reset {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .feedback-form .btn-reset:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .feedback-already-submitted {
            background: rgba(255, 170, 0, 0.08);
            border: 1px solid rgba(255, 170, 0, 0.15);
            border-radius: 12px;
            padding: 16px 20px;
        }
        .feedback-already-submitted .icon {
            color: #ffaa00;
            font-size: 28px;
        }
        .feedback-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .feedback-stat-card {
            background: rgba(10, 10, 10, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            transition: all 0.3s;
        }
        .feedback-stat-card:hover {
            border-color: rgba(0, 212, 255, 0.2);
        }
        .feedback-stat-card .stat-number {
            font-size: 24px;
            font-weight: 700;
        }
        .feedback-stat-card .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }
        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .rating-badge.good {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }
        .rating-badge.average {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
        }
        .rating-badge.poor {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }
        .emoji-display {
            font-size: 20px;
            line-height: 1;
        }
        .feedback-success-animation .icon {
            animation: feedback-pop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes feedback-pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);

        function sanitizeDataForFirebase(data) {
            if (data === undefined) return null;
            if (data === null) return null;
            if (typeof data !== 'object') return data;
            if (Array.isArray(data)) {
                return data.map(item => sanitizeDataForFirebase(item));
            }
            const cleaned = {};
            for (const key in data) {
                if (data[key] === undefined) {
                    cleaned[key] = null;
                } else if (data[key] === null) {
                    cleaned[key] = null;
                } else if (typeof data[key] === 'object') {
                    cleaned[key] = sanitizeDataForFirebase(data[key]);
                } else {
                    cleaned[key] = data[key];
                }
            }
            return cleaned;
        }

            console.log(`[Firebase ${type}] ${message}`);

        // ======================== FIREBASE SYNC ========================
        function syncToFirebase(force = false) {
            if (!firebaseDb) {
                addFirebaseLog('❌ Cannot sync: Firebase not ready', 'error');
                return Promise.reject('Firebase not ready');
            }
            if (firebaseIsSyncing && !force) {
                return Promise.resolve('Already syncing');
            }
            if (!isOnline) {
                addFirebaseLog('⏳ Offline - queuing sync for later', 'warn');
                pendingSyncQueue.push({ timestamp: new Date().toISOString() });
                return Promise.resolve('Queued for later');
            }

            firebaseIsSyncing = true;
            updateFirebaseStatus('syncing', 'Syncing...');
            addFirebaseLog('🔄 Syncing to Firebase...', 'info');

            const rawData = {
                services: appData.services || [],
                categories: appData.categories || [],
                customers: appData.customers || [],
                transactions: appData.transactions || [],
                openServices: appData.openServices || [],
                staff: appData.staff || [],
                expenses: appData.expenses || [],
                credits: appData.credits || [],
                inventory: appData.inventory || [],
                systemSettings: appData.systemSettings || {},
                users: appData.users || [],
                currentUser: appData.currentUser || null,
                nextIds: appData.nextIds || {},
                commissionMatrix: appData.commissionMatrix || {},
                reports: appData.reports || { weekly: [], monthly: [], yearly: [] },
                commissionReports: appData.commissionReports || { weekly: [], monthly: [], yearly: [] },
                commissionWeekly: appData.commissionWeekly || { current: null, archives: [] },
                transactionReports: appData.transactionReports || { daily: {}, weekly: {}, monthly: {},
                yearly: {} },
                auditTrail: appData.auditTrail || [],
                feedback: appData.feedback || [],
                adminPanelCustomizations: appData.adminPanelCustomizations || {},
                lastUpdated: new Date().toISOString(),
                version: '8.8.7'
            };

            const dataToSync = sanitizeDataForFirebase(rawData);
            const dataSize = JSON.stringify(dataToSync).length;
            addFirebaseLog(`📦 Syncing ${Object.keys(dataToSync).length} collections (${Math.round(dataSize / 1024)} KB)`,
                'info');

            return firebaseDb.ref('8068_pos_system_v8').set(dataToSync)
                .then(() => {
                    firebaseIsSyncing = false;
                    firebaseRetryCount = 0;
                    firebaseTotalSynced++;
                    isOnline = true;
                    localStorage.setItem('8068_last_sync_v8', new Date().toISOString());
                    addFirebaseLog('✅ Sync completed!', 'success');
                    updateFirebaseStatus('online', 'Primary');
                    const syncEl = document.getElementById('syncStatus');
                    if (syncEl) {
                        const countEl = syncEl.querySelector('.sync-count');
                        if (countEl) countEl.textContent = firebaseTotalSynced;
                    }
                    if (pendingSyncQueue.length > 0) {
                        pendingSyncQueue = [];
                        addFirebaseLog('🔄 Processing queued syncs...', 'info');
                    }
                    return true;
                })
                .catch((error) => {
                    firebaseIsSyncing = false;
                    isOnline = false;
                    addFirebaseLog(`❌ Sync error: ${error.message}`, 'error');
                    firebaseRetryCount++;
                    if (firebaseRetryCount < MAX_RETRIES) {
                        addFirebaseLog(`🔄 Retry ${firebaseRetryCount}/${MAX_RETRIES} in ${RETRY_DELAY}ms...`, 'warn');
                        updateFirebaseStatus('syncing', `Retry ${firebaseRetryCount}...`);
                        return new Promise((resolve) => {
                            setTimeout(() => {
                                resolve(syncToFirebase(true));
                            }, RETRY_DELAY);
                        });
                    } else {
                        updateFirebaseStatus('error', 'Sync Failed');
                        addFirebaseLog('❌ Max retries reached. Will retry later.', 'error');
                        pendingSyncQueue.push({ timestamp: new Date().toISOString() });
                        return false;
                    }
                });
        }

        function debouncedSync() {
            if (syncTimer) {
                clearTimeout(syncTimer);
            }
            syncTimer = setTimeout(() => {
                syncTimer = null;
                if (firebaseInitialized && isFirebasePrimary && !firebaseIsSyncing) {
                    syncToFirebase();
                } else if (!isOnline) {
                    initFirebase().then(() => {
                        if (isOnline) {
                            syncToFirebase();
                        }
                    });
                }
            }, 1500);
        }

        function setupFirebaseRealtimeListener() {
            if (!firebaseInitialized || !firebaseDb) return;
            firebaseListeners.forEach(ref => { try { ref.off(); } catch (e) {} });
            firebaseListeners = [];
            addFirebaseLog('🔌 Setting up real-time listener...', 'info');

            const ref = firebaseDb.ref('8068_pos_system_v8');
            ref.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && !firebaseIsSyncing && isFirebasePrimary && isOnline) {
                    addFirebaseLog('🔄 Real-time update received', 'info');
                    let hasChanges = false;
                    const skipKeys = ['lastUpdated', 'version', '_test_connection'];
                    Object.keys(data).forEach(key => {
                        if (skipKeys.includes(key)) return;
                        if (appData[key] !== undefined && data[key] !== null) {
                            const localStr = JSON.stringify(appData[key]);
                            const remoteStr = JSON.stringify(data[key]);
                            if (localStr !== remoteStr) {
                                appData[key] = data[key];
                                hasChanges = true;
                            }
                        }
                    });
                    if (hasChanges) {
                        saveToLocal();
                        addFirebaseLog('✅ Data updated from real-time sync', 'success');
                        updateFirebaseStatus('online', 'Primary');
                        renderApp();
                    }
                }
            }, (error) => {
                addFirebaseLog(`⚠️ Listener error: ${error.message}`, 'warn');
                isOnline = false;
                updateFirebaseStatus('offline', 'Listener Lost');
            });
            firebaseListeners.push(ref);
            addFirebaseLog('✅ Real-time listener active', 'success');
        }

                    average: 0,
                    fiveStar: 0,
                    fourStar: 0,
                    threeStar: 0,
                    twoStar: 0,
                    oneStar: 0,
                    positive: 0,
                    negative: 0,
                    neutral: 0,
                    pending: 0,
                    today: 0,
                    thisWeek: 0,
                    thisMonth: 0,
                    thisYear: 0
                };
            }

            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            const weekStart = getWeekStart(now);
            const weekStartStr = weekStart.toISOString().slice(0, 10);
            const monthStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            const yearStr = String(now.getFullYear());

            const total = all.length;
            const ratings = all.map(f => f.rating || 0);
            const avg = total > 0 ? ratings.reduce((s, r) => s + r, 0) / total : 0;
            const fiveStar = all.filter(f => f.rating === 5).length;
            const fourStar = all.filter(f => f.rating === 4).length;
            const threeStar = all.filter(f => f.rating === 3).length;
            const twoStar = all.filter(f => f.rating === 2).length;
            const oneStar = all.filter(f => f.rating === 1).length;
            const positive = all.filter(f => f.rating >= 4).length;
            const negative = all.filter(f => f.rating <= 2).length;
            const neutral = all.filter(f => f.rating === 3).length;
            const pending = all.filter(f => f.status === 'new').length;
            const today = all.filter(f => f.submissionDate && f.submissionDate.startsWith(todayStr)).length;
            const thisWeek = all.filter(f => f.submissionDate && f.submissionDate >= weekStartStr).length;
            const thisMonth = all.filter(f => f.submissionDate && f.submissionDate.startsWith(monthStr)).length;
            const thisYear = all.filter(f => f.submissionDate && f.submissionDate.startsWith(yearStr)).length;

            return {
                total,
                average: avg,
                fiveStar,
                fourStar,
                threeStar,
                twoStar,
                oneStar,
                positive,
                negative,
                neutral,
                pending,
                today,
                thisWeek,
                thisMonth,
                thisYear
            };
        }

        function getStaffPerformanceFromFeedback() {
            const all = getAllFeedback();
            const staffMap = {};

            all.forEach(f => {
                if (f.assignedStaff && f.assignedStaff !== 'N/A' && f.assignedStaff !== '') {
                    const staffNames = f.assignedStaff.split(',').map(s => s.trim()).filter(Boolean);
                    staffNames.forEach(name => {
                        if (!staffMap[name]) {
                            staffMap[name] = { total: 0, ratings: [], positive: 0, negative: 0 };
                        }
                        staffMap[name].total += 1;
                        const rating = f.rating || 0;
                        staffMap[name].ratings.push(rating);
                        if (rating >= 4) staffMap[name].positive += 1;
                        if (rating <= 2) staffMap[name].negative += 1;
                    });
                }
            });

            const result = Object.keys(staffMap).map(name => {
                const data = staffMap[name];
                const avg = data.ratings.length > 0 ? data.ratings.reduce((s, r) => s + r, 0) / data.ratings
                    .length : 0;
                return {
                    name,
                    totalServices: data.total,
                    totalFeedback: data.ratings.length,
                    averageRating: avg,
                    positiveFeedback: data.positive,
                    negativeFeedback: data.negative,
                    positivePercent: data.total > 0 ? (data.positive / data.total * 100) : 0
                };
            });

            result.sort((a, b) => b.averageRating - a.averageRating);
            return result;
        }

        // ===== WEEK START / END (Sunday-Saturday) =====
        function getWeekStart(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            d.setDate(d.getDate() - day);
            return d;
        }

        function getWeekEnd(date) {
            const d = getWeekStart(date);
            d.setDate(d.getDate() + 6);
            d.setHours(23, 59, 59, 999);
            return d;
        }

        function getWeekLabel(date) {
            const start = getWeekStart(date);
            const end = getWeekEnd(date);
            const options = { month: 'long', day: 'numeric', year: 'numeric' };
            return `Sunday, ${start.toLocaleDateString('en-US', options)} – Saturday, ${end.toLocaleDateString('en-US', options)}`;
        }

        function getWeekId(date) {
            const start = getWeekStart(date);
            const year = start.getFullYear();
            const jan1 = new Date(year, 0, 1);
            const days = Math.floor((start - jan1) / (24 * 60 * 60 * 1000));
            const weekNum = Math.ceil((days + 1) / 7);
            return `${year}-W${String(weekNum).padStart(2, '0')}`;
        }

        function getCurrentWeekId() {
            return getWeekId(new Date());
        }

        function getCurrentWeekStart() {
            return getWeekStart(new Date());
        }

        function getCurrentWeekEnd() {
            return getWeekEnd(new Date());
        }

        // ===== TRANSACTION REPORTS =====
        function updateTransactionReports(transaction) {
            if (!transaction) return;
            if (!appData.transactionReports) {
                appData.transactionReports = { daily: {}, weekly: {}, monthly: {}, yearly: {} };
            }

            const txDate = new Date(transaction.date);
            const dateKey = txDate.toISOString().slice(0, 10);
            const monthKey = `${txDate.getFullYear()}-${String(txDate.getMonth() + 1).padStart(2, '0')}`;
            const yearKey = `${txDate.getFullYear()}`;
            const weekId = getWeekId(txDate);
            const weekStartStr = getWeekStart(txDate).toISOString().slice(0, 10);

            if (!appData.transactionReports.daily[dateKey]) {
                appData.transactionReports.daily[dateKey] = { transactions: [], summary: {} };
            }
            const daily = appData.transactionReports.daily[dateKey];
            if (!daily.transactions.find(t => t.id === transaction.id)) {
                daily.transactions.push(transaction);
                daily.transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            daily.summary = computeTransactionSummary(daily.transactions);

            const weeklyKey = weekId;
            if (!appData.transactionReports.weekly[weeklyKey]) {
                appData.transactionReports.weekly[weeklyKey] = {
                    weekStart: weekStartStr,
                    weekEnd: getWeekEnd(txDate).toISOString().slice(0, 10),
                    weekLabel: getWeekLabel(txDate),
                    transactions: [],
                    summary: {}
                };
            }
            const weekly = appData.transactionReports.weekly[weeklyKey];
            if (!weekly.transactions.find(t => t.id === transaction.id)) {
                weekly.transactions.push(transaction);
                weekly.transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            weekly.summary = computeTransactionSummary(weekly.transactions);

            if (!appData.transactionReports.monthly[monthKey]) {
                appData.transactionReports.monthly[monthKey] = {
                    month: monthKey,
                    year: txDate.getFullYear(),
                    monthName: txDate.toLocaleString('default', { month: 'long' }),
                    transactions: [],
                    summary: {}
                };
            }
            const monthly = appData.transactionReports.monthly[monthKey];
            if (!monthly.transactions.find(t => t.id === transaction.id)) {
                monthly.transactions.push(transaction);
                monthly.transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            monthly.summary = computeTransactionSummary(monthly.transactions);

            if (!appData.transactionReports.yearly[yearKey]) {
                appData.transactionReports.yearly[yearKey] = {
                    year: yearKey,
                    transactions: [],
                    summary: {}
                };
            }
            const yearly = appData.transactionReports.yearly[yearKey];
            if (!yearly.transactions.find(t => t.id === transaction.id)) {
                yearly.transactions.push(transaction);
                yearly.transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            yearly.summary = computeTransactionSummary(yearly.transactions);

            saveToLocal();
        }

        function computeTransactionSummary(transactions) {
            if (!transactions || transactions.length === 0) {
                return {
                    totalTransactions: 0,
                    grossSales: 0,
                    cashPayments: 0,
                    gcashPayments: 0,
                    creditTransactions: 0,
                    totalDiscount: 0,
                    totalCommission: 0,
                    averageValue: 0,
                    highestAmount: 0,
                    lowestAmount: 0
                };
            }
            const total = transactions.length;
            const gross = transactions.reduce((s, t) => s + (t.total || 0), 0);
            const cash = transactions.filter(t => t.paymentMethod === 'Cash').reduce((s, t) => s + (t.total || 0), 0);
            const gcash = transactions.filter(t => t.paymentMethod === 'GCash').reduce((s, t) => s + (t.total || 0), 0);
            const credit = transactions.filter(t => t.paymentMethod === 'Credit (Utang)' || t.isCredit).length;
            const discount = transactions.reduce((s, t) => s + (t.discount || 0), 0);
            let commission = 0;
            transactions.forEach(t => {
                if (t.staffCommissions) {
                    commission += Object.values(t.staffCommissions).reduce((sum, st) => sum + (st.commission || 0),
                    0);
                }
            });
            const amounts = transactions.map(t => t.total || 0).filter(a => a > 0);
            const avg = total > 0 ? gross / total : 0;
            const highest = amounts.length > 0 ? Math.max(...amounts) : 0;
            const lowest = amounts.length > 0 ? Math.min(...amounts) : 0;

            return {
                totalTransactions: total,
                grossSales: gross,
                cashPayments: cash,
                gcashPayments: gcash,
                creditTransactions: credit,
                totalDiscount: discount,
                totalCommission: commission,
                averageValue: avg,
                highestAmount: highest,
                lowestAmount: lowest
            };
        }

        function recalculateAllTransactionReports() {
            appData.transactionReports = { daily: {}, weekly: {}, monthly: {}, yearly: {} };
            appData.transactions.forEach(tx => {
                updateTransactionReports(tx);
            });
            saveToLocal();
        }

        // ===== SEARCH VEHICLE HISTORY =====
        function searchVehicleHistory(plateNumber) {
            if (!plateNumber || plateNumber.trim() === '') return null;
            const plate = plateNumber.trim().toUpperCase();
            const tx = appData.transactions.filter(t => t.plate && t.plate.toUpperCase() === plate);
            if (tx.length === 0) return null;

            const firstVisit = tx.reduce((a, b) => new Date(a.date) < new Date(b.date) ? a : b);
            const latestVisit = tx.reduce((a, b) => new Date(a.date) > new Date(b.date) ? a : b);
            const totalVisits = tx.length;
            const totalSpent = tx.reduce((s, t) => s + (t.total || 0), 0);
            const services = [...new Set(tx.flatMap(t => t.items.map(i => i.serviceName)))];
            const staff = [...new Set(tx.flatMap(t => t.items.flatMap(i => i.assignedStaff?.map(s => s.name) || [])))];
            const payments = [...new Set(tx.map(t => t.paymentMethod))];
            const history = tx.map(t => ({
                id: t.id,
                date: t.date,
                customer: t.customer,
                items: t.items.map(i => ({ service: i.serviceName, variant: i.variant, price: i.price })),
                total: t.total,
                payment: t.paymentMethod,
                staff: t.items.flatMap(i => i.assignedStaff?.map(s => s.name) || []).filter((v, i, a) => a.indexOf(v) ===
                    i),
                remarks: t.remarks || ''
            }));

            return {
                plate: plate,
                firstVisit: firstVisit,
                latestVisit: latestVisit,
                totalVisits: totalVisits,
                totalSpent: totalSpent,
                services: services,
                staff: staff,
                payments: payments,
                history: history
            };
        }

        function completeSale() {
            if (posCart.length === 0) { alert("Please add services to cart!"); return; }
            const total = calcTotal();

            const isCredit = selectedPayment === 'Credit (Utang)';
            if (isCredit) {
                if (!selectedCustomer) {
                    alert("Please select a customer for credit transaction!");
                    return;
                }
                appData.credits.push({
                    id: 'CR-' + new Date().getFullYear() + '-' + (appData.nextIds.credit++),
                    customerName: selectedCustomer.name,
                    contact: selectedCustomer.mobile || '',
                    transactionId: 'PENDING-' + Date.now(),
                    amount: total,
                    paid: 0,
                    balance: total,
                    date: new Date().toISOString().slice(0, 10),
                    status: 'pending'
                });
            }

            if (selectedPayment === "Cash" && cashTendered < total) { alert("Insufficient cash!"); return; }

            const staffCommissionMap = new Map();
            posCart.forEach(item => {
                if (item.assignedStaff) {
                    item.assignedStaff.forEach(staff => {
                        const current = staffCommissionMap.get(staff.id) || { commission: 0, jobs: 0,
                            name: staff.name, tier: staff.commissionTier };
                        current.commission += staff.splitCommission;
                        current.jobs += 1;
                        staffCommissionMap.set(staff.id, current);
                    });
                }
            });

            const receiptNo = generateReceiptNo();
            const transaction = {
                id: receiptNo,
                date: new Date().toISOString(),
                customer: selectedCustomer ? selectedCustomer.name : "Walk-in Customer",
                customerId: selectedCustomer?.id || null,
                vehicle: vehicleInfo.model || "N/A",
                plate: vehicleInfo.plate || "N/A",
                items: posCart.map(i => ({ ...i })),
                staffCommissions: Object.fromEntries([...staffCommissionMap.entries()]),
                subtotal: calcSubtotal(),
                discount,
                loyaltyUsed: loyaltyPointsUsed,
                total,
                paymentMethod: selectedPayment,
                isCredit: isCredit,
                cashTendered: selectedPayment === "Cash" ? cashTendered : total,
                change: selectedPayment === "Cash" ? (cashTendered - total) : 0,
                remarks: cartRemarks + (isCredit ? ' (CREDIT - PENDING)' : ''),
                itemRemarks: posCart.map(i => ({ service: i.serviceName, remark: i.remarks || 'None' }))
            };

            appData.transactions.unshift(transaction);
            staffCommissionMap.forEach((data, staffId) => {
                const staff = appData.staff.find(s => s.id === staffId);
                if (staff) {
                    staff.totalCommission = (staff.totalCommission || 0) + data.commission;
                    staff.jobsCompleted = (staff.jobsCompleted || 0) + data.jobs;
                    staff.salesGenerated = (staff.salesGenerated || 0) + transaction.items.filter(i => i
                        .assignedStaff?.some(s => s.id === staffId)).reduce((sum, i) => sum + i.total,
                    0);
                }
            });

            if (selectedCustomer && !isCredit) {
                let earnedPoints = Math.floor(total * appData.systemSettings.loyaltyPointsPerPeso);
                selectedCustomer.loyaltyPoints = (selectedCustomer.loyaltyPoints || 0) + earnedPoints;
                const idx = appData.customers.findIndex(c => c.id === selectedCustomer.id);
                if (idx !== -1) appData.customers[idx].loyaltyPoints = selectedCustomer.loyaltyPoints;
            }

            updateTransactionReports(transaction);

            saveToLocal();
            recalculateAllCommissions();
            generatePeriodicReport('weekly');
            generatePeriodicReport('monthly');
            generatePeriodicReport('yearly');
            addActivityLog('Sale Completed', `Transaction ${transaction.id} - ₱${total.toFixed(2)} - ${selectedPayment}`);
            addAuditTrail('Sale Completed', `Transaction ${transaction.id} - ₱${total.toFixed(2)} - ${selectedPayment}`,
                transaction.id, 'transaction');

            updateDashboardStats();

            // ===== AUTOMATIC RECEIPT PRINTING - Dual Receipts with CUT MARKER =====
            printDualReceipts(transaction);

            alert(`✅ SALE COMPLETED!\nTotal: ₱${total.toFixed(2)}${isCredit ? '\n⚠️ CREDIT (UTANG) - PENDING PAYMENT' : ''}`);
            posCart = [];
            selectedCustomer = null;
            vehicleInfo = { plate: "", model: "", size: "Medium" };
            discount = 0;
            loyaltyPointsUsed = 0;
            cashTendered = 0;
            cartRemarks = "";
            renderApp();
        }

        function updateOpenServiceStatus(id, status) {
            const service = appData.openServices.find(s => s.id === id);
            if (service) {
                service.status = status;
                if (status === 'completed') {
                    service.completedAt = new Date().toISOString();
                    processOpenServiceCommission(service, true);
                    addActivityLog('Open Service Completed', `${service.customer} - ₱${service.total.toFixed(2)}`);
                    recalculateAllCommissions();
                }
                saveToLocal();
                renderApp();
            }
        }

        function processOpenServiceCommission(service, suppressTransaction = false) {
            if (service.commissionProcessed) return;
            if (!service.staff || service.staff.length === 0) return;

            const staffCommissionMap = new Map();
            service.items.forEach(item => {
                if (item.assignedStaff && item.assignedStaff.length > 0) {
                    item.assignedStaff.forEach(staff => {
                        const commissionAmt = getCommissionAmount(item.serviceName, item.variant, staff
                            .commissionTier);
                        const splitCommission = item.assignedStaff.length === 2 ? commissionAmt / 2 :
                            commissionAmt;

                        const current = staffCommissionMap.get(staff.id) || {
                            commission: 0,
                            jobs: 0,
                            name: staff.name,
                            tier: staff.commissionTier,
                            serviceTotal: 0
                        };
                        current.commission += splitCommission;
                        current.jobs += 1;
                        current.serviceTotal += item.total;
                        staffCommissionMap.set(staff.id, current);
                    });
                }
            });

            service.pendingCommission = {
                staffMap: Object.fromEntries([...staffCommissionMap.entries()].map(([id, data]) => [id, {
                    commission: data.commission,
                    tier: data.tier,
                    name: data.name,
                    jobs: data.jobs
                }])),
                total: service.total
            };

            if (!suppressTransaction) {
                finalizeServiceTransaction(service);
            } else {
                service.commissionProcessed = true;
                saveToLocal();
            }
        }

        function finalizeServiceTransaction(service) {
            if (!service.pendingCommission) {
                processOpenServiceCommission(service, false);
                if (!service.pendingCommission) return;
            }

            const staffMap = service.pendingCommission.staffMap || {};

            const receiptNo = generateReceiptNo();
            const transaction = {
                id: receiptNo,
                date: service.completedAt || new Date().toISOString(),
                customer: service.customer,
                vehicle: service.vehicle,
                plate: service.plate,
                items: service.items.map(i => ({ ...i })),
                staffCommissions: staffMap,
                subtotal: service.total,
                discount: 0,
                loyaltyUsed: 0,
                total: service.total,
                paymentMethod: 'Open Service (Completed)',
                cashTendered: service.total,
                change: 0,
                remarks: service.remarks + ' (Completed Service)',
                isOpenService: true,
                openServiceId: service.id,
                isCommissionAutoGenerated: true
            };

            const existingTx = appData.transactions.find(t => t.openServiceId === service.id && t
            .isCommissionAutoGenerated);
            if (!existingTx) {
                appData.transactions.unshift(transaction);
                updateTransactionReports(transaction);

                Object.entries(staffMap).forEach(([staffId, data]) => {
                    const staffMember = appData.staff.find(s => s.id === parseInt(staffId));
                    if (staffMember) {
                        staffMember.totalCommission = (staffMember.totalCommission || 0) + data.commission;
                        staffMember.jobsCompleted = (staffMember.jobsCompleted || 0) + data.jobs;
                        staffMember.salesGenerated = (staffMember.salesGenerated || 0) + service.total;
                    }
                });

                service.commissionProcessed = true;
                service.transactionId = transaction.id;
                delete service.pendingCommission;

                saveToLocal();
                recalculateAllCommissions();
                updateDashboardStats();
                renderApp();
            }
        }

            const paymentMethods = appData.systemSettings.defaultPaymentMethods || ['Cash', 'GCash', 'Maya',

            const existingTx = appData.transactions.find(t => t.openServiceId === service.id);
            const isPaid = service.status === 'paid';

            let modalHtml = `<div id="paymentModal" class="modal"><div class="modal-content">

                ${!isPaid ? `

                <div class="flex gap-3 mt-4">
                    ${!isPaid ? `<button onclick="confirmPayment('${id}')" class="btn-neon flex-1 p-2 rounded">Complete Payment</button>` : `<button onclick="reprintReceipt('${id}')" class="btn-neon flex-1 p-2 rounded"><i class="fas fa-print"></i> Reprint Receipt</button>`}

                document.getElementById('payMethod').addEventListener('change', function() {
                    document.getElementById('cashDiv').style.display = this.value === 'Cash' ? 'block' : 'none';
                });
            }
        };

        window.confirmPayment = (id) => {
            const method = document.getElementById('payMethod')?.value || 'Cash';
            const cash = parseFloat(document.getElementById('payCash')?.value || 0);
            completeOpenServicePayment(id, method, cash);
            closePaymentModal();
        };

        window.closePaymentModal = () => document.getElementById('paymentModal')?.remove();

        function completeOpenServicePayment(id, paymentMethod, cashTendered) {
            const service = appData.openServices.find(s => s.id === id);
            if (!service) return;
            const total = service.total;
            if (paymentMethod === "Cash" && cashTendered < total) {
                alert("Insufficient cash!");
                return;
            }

            if (!service.commissionProcessed) {
                processOpenServiceCommission(service, false);
            } else if (service.commissionProcessed && !service.transactionId) {
                finalizeServiceTransaction(service);
            }

            const existingTx = appData.transactions.find(t => t.openServiceId === service.id && t
            .isCommissionAutoGenerated);
            if (existingTx) {
                existingTx.paymentMethod = paymentMethod;
                existingTx.cashTendered = paymentMethod === "Cash" ? cashTendered : total;
                existingTx.change = paymentMethod === "Cash" ? (cashTendered - total) : 0;
                existingTx.isCredit = paymentMethod === 'Credit (Utang)';
                if (paymentMethod === 'Credit (Utang)') {
                    existingTx.remarks = (existingTx.remarks || '') + ' (CREDIT - PENDING)';
                }
                updateTransactionReports(existingTx);
                saveToLocal();
            } else {
                const receiptNo = generateReceiptNo();
                const transaction = {
                    id: receiptNo,
                    date: new Date().toISOString(),
                    customer: service.customer,
                    vehicle: service.vehicle,
                    plate: service.plate,
                    items: service.items.map(i => ({ ...i })),
                    subtotal: total,
                    discount: 0,
                    loyaltyUsed: 0,
                    total: total,
                    paymentMethod: paymentMethod,
                    cashTendered: paymentMethod === "Cash" ? cashTendered : total,
                    change: paymentMethod === "Cash" ? (cashTendered - total) : 0,
                    remarks: service.remarks + (paymentMethod === 'Credit (Utang)' ? ' (CREDIT - PENDING)' : ''),
                    isOpenService: true,
                    openServiceId: service.id,
                    staffCommissions: service.staffCommissions || {}
                };
                appData.transactions.unshift(transaction);
                updateTransactionReports(transaction);
                saveToLocal();
                recalculateAllCommissions();
            }

            if (paymentMethod === 'Credit (Utang)') {
                appData.credits.push({
                    id: 'CR-' + new Date().getFullYear() + '-' + (appData.nextIds.credit++),
                    customerName: service.customer,
                    contact: '',
                    transactionId: existingTx ? existingTx.id : 'PENDING-' + Date.now(),
                    amount: total,
                    paid: 0,
                    balance: total,
                    date: new Date().toISOString().slice(0, 10),
                    status: 'pending'
                });
                saveToLocal();
            }

            service.paidAt = new Date().toISOString();
            service.status = 'paid';
            saveToLocal();
            recalculateAllCommissions();
            updateDashboardStats();
            addActivityLog('Payment Completed', `${service.customer} - ₱${total.toFixed(2)} - ${paymentMethod}`);
            addAuditTrail('Payment Completed', `${service.customer} - ₱${total.toFixed(2)} - ${paymentMethod}`,
                service.id, 'open_service');
            alert(`✅ Payment Completed!\nTotal: ₱${total.toFixed(2)}`);

            const txToPrint = appData.transactions.find(t => t.openServiceId === service.id);
            if (txToPrint) printDualReceipts(txToPrint);
            appData.openServices = appData.openServices.filter(s => s.id !== id);
            renderApp();
        }

            msg += `📞 Contact: ${customer.mobile || 'N/A'}\n`;
            msg += `🚗 Vehicle: ${customer.vehicleInfo || 'N/A'} | ${customer.plate || 'N/A'}\n`;
            msg += `⭐ Loyalty Points: ${customer.loyaltyPoints || 0}\n`;
            msg += `💰 Total Spent: ₱${totalSpent.toFixed(2)}\n`;
            msg += `💳 Credit Balance: ₱${totalCredit.toFixed(2)}\n`;
            msg += `📦 Transactions: ${tx.length}\n`;
            msg += `💬 Feedback: ${feedbacks.length}\n\n`;

            if (tx.length > 0) {
                msg += `📋 RECENT TRANSACTIONS:\n`;
                tx.slice(0, 10).forEach((t, i) => {
                    msg += `  ${i+1}. ${t.id} | ${new Date(t.date).toLocaleDateString()} | ₱${t.total.toFixed(2)} | ${t.paymentMethod}\n`;
                });
                if (tx.length > 10) msg += `  ... and ${tx.length - 10} more\n`;
            }
            if (credits.length > 0) {
                msg += `\n💳 CREDIT HISTORY:\n`;
                credits.forEach(cr => {
                    msg +=
                        `  ${cr.id} | ₱${cr.amount.toFixed(2)} | Paid: ₱${(cr.paid || 0).toFixed(2)} | Balance: ₱${(cr.balance || 0).toFixed(2)} | ${cr.status}\n`;
                });
            }
            if (feedbacks.length > 0) {
                msg += `\n💬 FEEDBACK:\n`;
                feedbacks.forEach(f => {
                    msg +=
                        `  ${f.id} | ${f.customerName || 'Anonymous'} | ${f.rating}★ | ${f.comment || 'No comment'}\n`;
                });
            }
            alert(msg);
        };

        // ===== ENHANCED STAFF DASHBOARD MANAGEMENT =====
        function renderEnhancedStaffDashboard() {
            if (showLogin) return renderLogin();
            if (!hasRole(['Owner', 'Manager'])) {
                return `<div class="card-premium p-8 text-center"><i class="fas fa-lock text-4xl text-red-400 mb-4"></i><p class="text-xl">Access Denied. Manager or Owner required.</p></div>`;

            let staffList = appData.staff.map(s => {
                const totalJobs = s.jobsCompleted || 0;
                const totalCommission = s.totalCommission || 0;
                const salesGenerated = s.salesGenerated || 0;
                const tier = s.commissionTier || 35;

                let commissionStatus = 'Inactive';
                let statusColor = 'text-red-400';
                if (totalCommission > 0 && totalJobs > 0) {
                    commissionStatus = 'Active';
                    statusColor = 'text-green-400';
                } else if (totalJobs > 0 && totalCommission === 0) {
                    commissionStatus = 'Pending';
                    statusColor = 'text-yellow-400';
                }

                return {
                    id: s.id,
                    name: s.name || 'Unnamed',
                    position: s.position || 'Staff',
                    tier: tier,
                    jobsCompleted: totalJobs,
                    salesGenerated: salesGenerated,
                    totalCommission: totalCommission,
                    commissionStatus: commissionStatus,
                    statusColor: statusColor,
                    isActive: s.isActive !== false,
                    contact: s.contact || '',
                    email: s.email || '',
                    joinDate: s.joinDate || new Date().toISOString().slice(0, 10)
                };

            if (staffSearchQuery && staffSearchQuery.trim() !== '') {
                const q = staffSearchQuery.trim().toLowerCase();
                staffList = staffList.filter(s =>
                    s.name.toLowerCase().includes(q) ||
                    s.position.toLowerCase().includes(q) ||
                    s.contact.toLowerCase().includes(q) ||
                    s.email.toLowerCase().includes(q)

            staffList.sort((a, b) => {
                let valA, valB;

                        valB = b.id;

                    case 'name':
                        valA = a.name.toLowerCase();
                        valB = b.name.toLowerCase();
                        break;
                    case 'position':
                        valA = a.position.toLowerCase();
                        valB = b.position.toLowerCase();
                        break;
                    case 'tier':
                        valA = a.tier;
                        valB = b.tier;
                        break;
                    case 'jobs':
                        valA = a.jobsCompleted;
                        valB = b.jobsCompleted;

                    case 'commission':

                        valB = b.totalCommission;
                        break;
                    case 'status':

                        valB = b.commissionStatus;

                    default:

                        valB = b.id;

        window.confirmAddStaff = function() {
            const name = document.getElementById('newStaffName')?.value?.trim();
            const position = document.getElementById('newStaffPosition')?.value?.trim() || 'Staff';
            const tier = parseInt(document.getElementById('newStaffTier')?.value) || 35;
            const contact = document.getElementById('newStaffContact')?.value?.trim() || '';
            const email = document.getElementById('newStaffEmail')?.value?.trim() || '';
            const joinDate = document.getElementById('newStaffDate')?.value || new Date().toISOString().slice(0, 10);

            if (!name) { alert("Staff name is required!"); return; }

            const newStaff = {
                id: Date.now(),
                name: name,
                position: position,
                commissionTier: tier,
                contact: contact,
                email: email,
                joinDate: joinDate,
                isActive: true,
                totalCommission: 0,
                jobsCompleted: 0,
                salesGenerated: 0,
                weeklyBreakdown: { Sunday: 0, Monday: 0, Tuesday: 0, Wednesday: 0, Thursday: 0, Friday: 0,
                    Saturday: 0 },
                weeklyCommission: 0,
                monthlyCommission: 0,
                yearlyCommission: 0
            };

            appData.staff.push(newStaff);
            saveToLocal();
            document.getElementById('staffModal')?.remove();
            addActivityLog('Staff Added', `${name} (${position})`);
            addAuditTrail('Staff Added', `${name} (${position})`, newStaff.id, 'staff');
            renderApp();
            alert(`✅ Staff "${name}" added successfully!`);
        };

        // ===== DASHBOARD =====
        function getChartData(period) {
            const now = new Date();
            let labels = [];
            let data = [];
            let periodLabel = '';

            if (period === 'daily') {
                const days = 30;
                for (let i = days - 1; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(now.getDate() - i);
                    const dateStr = d.toISOString().slice(0, 10);
                    labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                    const dayTx = appData.transactions.filter(t => t.date.startsWith(dateStr));
                    data.push(dayTx.reduce((s, t) => s + t.total, 0));
                }
                periodLabel = 'Daily (30 Days)';
            } else if (period === 'weekly') {
                const weeks = 12;
                for (let i = weeks - 1; i >= 0; i--) {
                    const weekStart = getWeekStart(new Date(now.getTime() - 7 * i * 24 * 60 * 60 * 1000));
                    const weekEnd = getWeekEnd(weekStart);
                    const weekStartStr = weekStart.toISOString().slice(0, 10);
                    const weekEndStr = weekEnd.toISOString().slice(0, 10);
                    labels.push(`W${weeks - i}`);
                    const weekTx = appData.transactions.filter(t => t.date >= weekStartStr && t.date <=
                    weekEndStr);
                    data.push(weekTx.reduce((s, t) => s + t.total, 0));
                }
                periodLabel = 'Weekly (12 Weeks)';
            } else if (period === 'monthly') {
                const months = 12;
                for (let i = months - 1; i >= 0; i--) {
                    const d = new Date(now);
                    d.setMonth(now.getMonth() - i);
                    const month = d.getMonth();
                    const year = d.getFullYear();
                    labels.push(d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }));
                    const monthTx = appData.transactions.filter(t => {
                        const td = new Date(t.date);
                        return td.getMonth() === month && td.getFullYear() === year;
                    });
                    data.push(monthTx.reduce((s, t) => s + t.total, 0));
                }
                periodLabel = 'Monthly (12 Months)';
            }

            return { labels, data, periodLabel };
        }

        // ===== COMMISSION REPORTS =====
        function recalculateAllCommissions() {
            appData.staff.forEach(s => {
                s.totalCommission = 0;
                s.jobsCompleted = 0;
                s.salesGenerated = 0;
                s.weeklyBreakdown = { Sunday: 0, Monday: 0, Tuesday: 0, Wednesday: 0, Thursday: 0, Friday: 0,
                    Saturday: 0 };
                s.weeklyCommission = 0;
                s.monthlyCommission = 0;
                s.yearlyCommission = 0;
            });

            appData.commissionReports = { weekly: [], monthly: [], yearly: [] };

            const weeklyGroups = {};
            const monthlyGroups = {};
            const yearlyGroups = {};

            appData.transactions.forEach(t => {
                if (!t.staffCommissions) return;
                const txDate = new Date(t.date);
                const weekStart = getWeekStart(txDate);
                const weekId = getWeekId(txDate);
                const monthKey = `${txDate.getFullYear()}-${String(txDate.getMonth() + 1).padStart(2, '0')}`;
                const yearKey = `${txDate.getFullYear()}`;

                if (!weeklyGroups[weekId]) {
                    weeklyGroups[weekId] = {
                        weekStart: weekStart.toISOString(),
                        weekEnd: getWeekEnd(txDate).toISOString(),
                        weekLabel: getWeekLabel(txDate),
                        staff: {},
                        totals: { commission: 0, sales: 0, jobs: 0, transactions: 0 },
                        dailyBreakdown: {}
                    };
                }
                if (!monthlyGroups[monthKey]) {
                    monthlyGroups[monthKey] = { month: monthKey, staff: {}, totals: { commission: 0, sales: 0,
                            jobs: 0, transactions: 0 } };
                }
                if (!yearlyGroups[yearKey]) {
                    yearlyGroups[yearKey] = { year: yearKey, staff: {}, totals: { commission: 0, sales: 0,
                            jobs: 0, transactions: 0 } };
                }

                const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const dayName = dayNames[txDate.getDay()];
                if (!weeklyGroups[weekId].dailyBreakdown[dayName]) {
                    weeklyGroups[weekId].dailyBreakdown[dayName] = { commission: 0, sales: 0, jobs: 0 };
                }

                Object.entries(t.staffCommissions).forEach(([staffId, data]) => {
                    const sid = parseInt(staffId);
                    const staffMember = appData.staff.find(s => s.id === sid);
                    if (!staffMember) return;

                    const commission = data.commission || 0;
                    const jobs = data.jobs || 1;
                    const sales = t.total || 0;

                    staffMember.totalCommission = (staffMember.totalCommission || 0) + commission;
                    staffMember.jobsCompleted = (staffMember.jobsCompleted || 0) + jobs;
                    staffMember.salesGenerated = (staffMember.salesGenerated || 0) + sales;
                    staffMember.weeklyBreakdown[dayName] = (staffMember.weeklyBreakdown[dayName] || 0) + commission;
                    staffMember.weeklyCommission = (staffMember.weeklyCommission || 0) + commission;
                    staffMember.monthlyCommission = (staffMember.monthlyCommission || 0) + commission;
                    staffMember.yearlyCommission = (staffMember.yearlyCommission || 0) + commission;

                    if (!weeklyGroups[weekId].staff[sid]) {
                        weeklyGroups[weekId].staff[sid] = {
                            name: staffMember.name,
                            position: staffMember.position,
                            tier: staffMember.commissionTier,
                            commission: 0,
                            jobs: 0,
                            sales: 0,
                            daily: { Sunday: 0, Monday: 0, Tuesday: 0, Wednesday: 0, Thursday: 0, Friday: 0,
                                Saturday: 0 }
                        };
                    }
                    weeklyGroups[weekId].staff[sid].commission += commission;
                    weeklyGroups[weekId].staff[sid].jobs += jobs;
                    weeklyGroups[weekId].staff[sid].sales += sales;
                    weeklyGroups[weekId].staff[sid].daily[dayName] = (weeklyGroups[weekId].staff[sid].daily[
                        dayName] || 0) + commission;
                    weeklyGroups[weekId].totals.commission += commission;
                    weeklyGroups[weekId].totals.sales += sales;
                    weeklyGroups[weekId].totals.jobs += jobs;
                    weeklyGroups[weekId].totals.transactions += 1;
                    weeklyGroups[weekId].dailyBreakdown[dayName].commission += commission;
                    weeklyGroups[weekId].dailyBreakdown[dayName].sales += sales;
                    weeklyGroups[weekId].dailyBreakdown[dayName].jobs += jobs;

                    if (!monthlyGroups[monthKey].staff[sid]) {
                        monthlyGroups[monthKey].staff[sid] = {
                            name: staffMember.name,
                            position: staffMember.position,
                            tier: staffMember.commissionTier,
                            commission: 0,
                            jobs: 0,
                            sales: 0
                        };
                    }
                    monthlyGroups[monthKey].staff[sid].commission += commission;
                    monthlyGroups[monthKey].staff[sid].jobs += jobs;
                    monthlyGroups[monthKey].staff[sid].sales += sales;
                    monthlyGroups[monthKey].totals.commission += commission;
                    monthlyGroups[monthKey].totals.sales += sales;
                    monthlyGroups[monthKey].totals.jobs += jobs;
                    monthlyGroups[monthKey].totals.transactions += 1;

                    if (!yearlyGroups[yearKey].staff[sid]) {
                        yearlyGroups[yearKey].staff[sid] = {
                            name: staffMember.name,
                            position: staffMember.position,
                            tier: staffMember.commissionTier,
                            commission: 0,
                            jobs: 0,
                            sales: 0
                        };
                    }
                    yearlyGroups[yearKey].staff[sid].commission += commission;
                    yearlyGroups[yearKey].staff[sid].jobs += jobs;
                    yearlyGroups[yearKey].staff[sid].sales += sales;
                    yearlyGroups[yearKey].totals.commission += commission;
                    yearlyGroups[yearKey].totals.sales += sales;
                    yearlyGroups[yearKey].totals.jobs += jobs;
                    yearlyGroups[yearKey].totals.transactions += 1;
                });
            });

            appData.openServices.forEach(s => {
                if (s.completedAt && s.commissionProcessed && s.pendingCommission) {
                    const txDate = new Date(s.completedAt);
                    const weekId = getWeekId(txDate);
                    const monthKey = `${txDate.getFullYear()}-${String(txDate.getMonth() + 1).padStart(2, '0')}`;
                    const yearKey = `${txDate.getFullYear()}`;
                    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday',
                    'Saturday'];

                    if (!weeklyGroups[weekId]) {
