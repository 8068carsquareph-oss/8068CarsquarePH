                            weekStart: getWeekStart(txDate).toISOString(),
                            weekEnd: getWeekEnd(txDate).toISOString(),
                            weekLabel: getWeekLabel(txDate),
                            staff: {},
                            totals: { commission: 0, sales: 0, jobs: 0, transactions: 0 },
                            dailyBreakdown: {}
                        };
                    }
                    if (!weeklyGroups[weekId].dailyBreakdown[dayName]) {
                        weeklyGroups[weekId].dailyBreakdown[dayName] = { commission: 0, sales: 0, jobs: 0 };
                    }
                    if (!monthlyGroups[monthKey]) {
                        monthlyGroups[monthKey] = { month: monthKey, staff: {}, totals: { commission: 0,
                                sales: 0, jobs: 0, transactions: 0 } };
                    }
                    if (!yearlyGroups[yearKey]) {
                        yearlyGroups[yearKey] = { year: yearKey, staff: {}, totals: { commission: 0, sales: 0,
                                jobs: 0, transactions: 0 } };
                    }

                    const staffMap = s.pendingCommission.staffMap || {};
                    Object.entries(staffMap).forEach(([staffId, data]) => {
                        const sid = parseInt(staffId);
                        const staffMember = appData.staff.find(st => st.id === sid);
                        if (!staffMember) return;

                        const commission = data.commission || 0;
                        const jobs = data.jobs || 1;
                        const sales = s.total || 0;

                        staffMember.totalCommission = (staffMember.totalCommission || 0) + commission;
                        staffMember.jobsCompleted = (staffMember.jobsCompleted || 0) + jobs;
                        staffMember.salesGenerated = (staffMember.salesGenerated || 0) + sales;
                        staffMember.weeklyBreakdown[dayName] = (staffMember.weeklyBreakdown[dayName] || 0) +
                        commission;
                        staffMember.weeklyCommission = (staffMember.weeklyCommission || 0) + commission;
                        staffMember.monthlyCommission = (staffMember.monthlyCommission || 0) + commission;
                        staffMember.yearlyCommission = (staffMember.yearlyCommission || 0) + commission;

                        if (!weeklyGroups[weekId].staff[sid]) {
                            weeklyGroups[weekId].staff[sid] = {
                                name: staffMember.name,
                                position: staffMember.position,
                                tier: staffMember.commissionTier,
                                commission: 0,
                                jobs: 0,
                                sales: 0,
                                daily: { Sunday: 0, Monday: 0, Tuesday: 0, Wednesday: 0, Thursday: 0,
                                    Friday: 0, Saturday: 0 }
                            };
                        }
                        weeklyGroups[weekId].staff[sid].commission += commission;
                        weeklyGroups[weekId].staff[sid].jobs += jobs;
                        weeklyGroups[weekId].staff[sid].sales += sales;
                        weeklyGroups[weekId].staff[sid].daily[dayName] = (weeklyGroups[weekId].staff[sid].daily[
                            dayName] || 0) + commission;
                        weeklyGroups[weekId].totals.commission += commission;
                        weeklyGroups[weekId].totals.sales += sales;
                        weeklyGroups[weekId].totals.jobs += jobs;
                        weeklyGroups[weekId].totals.transactions += 1;
                        weeklyGroups[weekId].dailyBreakdown[dayName].commission += commission;
                        weeklyGroups[weekId].dailyBreakdown[dayName].sales += sales;
                        weeklyGroups[weekId].dailyBreakdown[dayName].jobs += jobs;

                        if (!monthlyGroups[monthKey].staff[sid]) {
                            monthlyGroups[monthKey].staff[sid] = {
                                name: staffMember.name,
                                position: staffMember.position,
                                tier: staffMember.commissionTier,
                                commission: 0,
                                jobs: 0,
                                sales: 0
                            };
                        }
                        monthlyGroups[monthKey].staff[sid].commission += commission;
                        monthlyGroups[monthKey].staff[sid].jobs += jobs;
                        monthlyGroups[monthKey].staff[sid].sales += sales;
                        monthlyGroups[monthKey].totals.commission += commission;
                        monthlyGroups[monthKey].totals.sales += sales;
                        monthlyGroups[monthKey].totals.jobs += jobs;
                        monthlyGroups[monthKey].totals.transactions += 1;

                        if (!yearlyGroups[yearKey].staff[sid]) {
                            yearlyGroups[yearKey].staff[sid] = {
                                name: staffMember.name,
                                position: staffMember.position,
                                tier: staffMember.commissionTier,
                                commission: 0,
                                jobs: 0,
                                sales: 0
                            };
                        }
                        yearlyGroups[yearKey].staff[sid].commission += commission;
                        yearlyGroups[yearKey].staff[sid].jobs += jobs;
                        yearlyGroups[yearKey].staff[sid].sales += sales;
                        yearlyGroups[yearKey].totals.commission += commission;
                        yearlyGroups[yearKey].totals.sales += sales;
                        yearlyGroups[yearKey].totals.jobs += jobs;
                        yearlyGroups[yearKey].totals.transactions += 1;
                    });
                }
            });

            const sortedWeekIds = Object.keys(weeklyGroups).sort((a, b) => {
                const dateA = new Date(weeklyGroups[a].weekStart);
                const dateB = new Date(weeklyGroups[b].weekStart);
                return dateB - dateA;
            });

            appData.commissionReports.weekly = sortedWeekIds.map(id => weeklyGroups[id]);

            const sortedMonths = Object.keys(monthlyGroups).sort((a, b) => b.localeCompare(a));
            appData.commissionReports.monthly = sortedMonths.map(key => monthlyGroups[key]);

            const sortedYears = Object.keys(yearlyGroups).sort((a, b) => b.localeCompare(a));
            appData.commissionReports.yearly = sortedYears.map(key => yearlyGroups[key]);

            const now = new Date();
            const currentWeekId = getWeekId(now);
            if (weeklyGroups[currentWeekId]) {
                appData.commissionWeekly.current = {
                    weekStart: weeklyGroups[currentWeekId].weekStart,
                    weekEnd: weeklyGroups[currentWeekId].weekEnd,
                    weekLabel: weeklyGroups[currentWeekId].weekLabel,
                    staff: weeklyGroups[currentWeekId].staff,
                    totals: weeklyGroups[currentWeekId].totals,
                    dailyBreakdown: weeklyGroups[currentWeekId].dailyBreakdown
                };
            } else {
                const weekStart = getWeekStart(now);
                const weekEnd = getWeekEnd(now);
                appData.commissionWeekly.current = {
                    weekStart: weekStart.toISOString(),
                    weekEnd: weekEnd.toISOString(),
                    weekLabel: getWeekLabel(now),
                    staff: {},
                    totals: { commission: 0, sales: 0, jobs: 0, transactions: 0 },
                    dailyBreakdown: {
                        Sunday: { commission: 0, sales: 0, jobs: 0 },
                        Monday: { commission: 0, sales: 0, jobs: 0 },
                        Tuesday: { commission: 0, sales: 0, jobs: 0 },
                        Wednesday: { commission: 0, sales: 0, jobs: 0 },
                        Thursday: { commission: 0, sales: 0, jobs: 0 },
                        Friday: { commission: 0, sales: 0, jobs: 0 },
                        Saturday: { commission: 0, sales: 0, jobs: 0 }
                    }
                };
            }

            const archives = [];
            const currentWeekStart = getWeekStart(now);
            Object.keys(weeklyGroups).forEach(id => {
                const weekStart = new Date(weeklyGroups[id].weekStart);
                if (weekStart < currentWeekStart) {
                    archives.push({
                        weekStart: weeklyGroups[id].weekStart,
                        weekEnd: weeklyGroups[id].weekEnd,
                        weekLabel: weeklyGroups[id].weekLabel,
                        staff: weeklyGroups[id].staff,
                        totals: weeklyGroups[id].totals,
                        dailyBreakdown: weeklyGroups[id].dailyBreakdown,
                        archivedAt: new Date().toISOString()
                    });
                }
            });
            archives.sort((a, b) => new Date(b.weekStart) - new Date(a.weekStart));
            appData.commissionWeekly.archives = archives;

            appData.reports.weekly = appData.commissionReports.weekly;
            appData.reports.monthly = appData.commissionReports.monthly;
            appData.reports.yearly = appData.commissionReports.yearly;

            saveToLocal();
            return true;
        }

        window.handleFeedbackSubmit = function(e) {
            e.preventDefault();

            // Get receipt from hidden or manual input
            let receipt = document.getElementById('fbReceipt')?.value;
            const manualInput = document.getElementById('fbReceiptManual');
            if (manualInput && !receipt) {
                receipt = manualInput.value.trim();
            }
            if (!receipt) receipt = null;

            const rating = parseInt(document.getElementById('fbRating')?.value || 0);
            const emoji = document.getElementById('fbEmoji')?.value || '';
            const comment = document.getElementById('fbComment')?.value?.trim() || '';
            const name = document.getElementById('fbName')?.value?.trim() || '';
            const contact = document.getElementById('fbContact')?.value?.trim() || '';
            const agree = document.getElementById('fbAgree')?.checked || false;

            if (rating === 0) {
                alert('Please rate your experience (select stars).');
                return;
            }
            if (!emoji) {
                alert('Please select an emoji that best describes your feeling.');
                return;
            }

            const result = submitFeedback(receipt, name, contact, rating, emoji, comment, agree);

            if (result.success) {
                const fbData = result.feedback;
                const main = document.getElementById("mainContent");
                if (main) {
                    main.innerHTML = renderFeedbackThankYou(fbData);
                }
                showFeedbackNotification(fbData);
            } else {
                alert(result.message || 'Failed to submit feedback. Please try again.');
            }
        };

            const receipt = input?.value?.trim();
            if (!receipt) {
                alert('Please enter a receipt number.');
                return;
            }
            const main = document.getElementById("mainContent");
            if (main) {
                main.innerHTML = renderFeedbackForm(receipt);
            }
            const url = new URL(window.location);
            url.searchParams.set('receipt', receipt);
            window.history.pushState({}, '', url);
        };

        window.navigateFeedback = function(receipt = null) {
            const main = document.getElementById("mainContent");
            if (main) {
                main.innerHTML = renderFeedbackForm(receipt);
            }
            const url = new URL(window.location);
            if (receipt) {
                url.searchParams.set('receipt', receipt);
            } else {
                url.searchParams.delete('receipt');
            }
            window.history.pushState({}, '', url);
        };

        function renderAdminFeedback() {
            if (showLogin) return renderLogin();
            if (!hasRole(['Owner', 'Manager'])) {
                return `<div class="card-premium p-8 text-center"><i class="fas fa-lock text-4xl text-red-400 mb-4"></i><p class="text-xl">Access Denied. Manager or Owner required.</p></div>`;
            }

            let allFeedback = getAllFeedback();

            if (feedbackSearchQuery && feedbackSearchQuery.trim() !== '') {
                const q = feedbackSearchQuery.trim().toLowerCase();
                allFeedback = allFeedback.filter(f =>
                    (f.receiptNumber && f.receiptNumber.toLowerCase().includes(q)) ||
                    (f.transactionId && f.transactionId.toLowerCase().includes(q)) ||
                    (f.customerName && f.customerName.toLowerCase().includes(q)) ||
                    (f.vehicleModel && f.vehicleModel.toLowerCase().includes(q)) ||
                    (f.plateNumber && f.plateNumber.toLowerCase().includes(q)) ||
                    (f.serviceAvailed && f.serviceAvailed.toLowerCase().includes(q)) ||
                    (f.assignedStaff && f.assignedStaff.toLowerCase().includes(q)) ||
                    (f.comment && f.comment.toLowerCase().includes(q))
                );
            }

            if (feedbackFilterRating !== 'all') {
                const ratingVal = parseInt(feedbackFilterRating);
                allFeedback = allFeedback.filter(f => (f.rating || 0) === ratingVal);
            }

            if (feedbackFilterStatus !== 'all') {
                allFeedback = allFeedback.filter(f => f.status === feedbackFilterStatus);
            }

            if (feedbackFilterStaff !== 'all') {
                allFeedback = allFeedback.filter(f => f.assignedStaff && f.assignedStaff.includes(feedbackFilterStaff));
            }

            allFeedback.sort((a, b) => {
                const dateA = a.submissionDate ? new Date(a.submissionDate) : new Date(0);
                const dateB = b.submissionDate ? new Date(b.submissionDate) : new Date(0);
                return dateB - dateA;
            });

            const totalFeedbacks = allFeedback.length;
            const totalPages = Math.ceil(totalFeedbacks / feedbackPageSize);
            const startIdx = (feedbackCurrentPage - 1) * feedbackPageSize;
            const paginatedFeedback = allFeedback.slice(startIdx, startIdx + feedbackPageSize);

            const stats = getFeedbackStats();
            const staffPerformance = getStaffPerformanceFromFeedback();

        function checkFeedbackURL() {

            if ((feedbackParam !== null || receiptParam) && !(appData.currentUser && hasRole(['Owner', 'Manager']) && !
                    receiptParam)) {
                const main = document.getElementById("mainContent");
                if (main) {
                    main.innerHTML = renderFeedbackForm(receiptParam || null);
                }
                return true;
            }
            return false;
        }

        function addAIMessage(role, content) {
            const chat = document.getElementById('aiChat');
            if (!chat) return;
            const msgDiv = document.createElement('div');
            msgDiv.className = `ai-message ${role}`;
            let formatted = content;
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            formatted = formatted.replace(/• (.*?)(<br>|$)/g, '• $1<br>');
            formatted = formatted.replace(/₱([\d,]+\.\d{2})/g, '<span class="highlight-green">₱$1</span>');
            formatted = formatted.replace(/(\d+)★/g, '<span class="highlight-yellow">$1★</span>');
            formatted = formatted.replace(/⚠️/g, '<span class="highlight-red">⚠️</span>');
            formatted = formatted.replace(/✅/g, '<span class="highlight-green">✅</span>');
            msgDiv.innerHTML = formatted;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
            aiChatHistory.push({ role, content });
        }

        function processAIQuery(query) {
            const q = query.toLowerCase().trim();
            addAIMessage('user', query);
            showTypingIndicator();

            setTimeout(() => {
                hideTypingIndicator();
                let response = '';

                if (q.includes('today') && (q.includes('sales') || q.includes('revenue') || q.includes('transaction'))) {
                    const today = new Date().toISOString().slice(0, 10);
                    const todayTx = appData.transactions.filter(t => t.date.startsWith(today));
                    const total = todayTx.reduce((s, t) => s + t.total, 0);
                    const count = todayTx.length;
                    const avg = count > 0 ? total / count : 0;
                    const commissions = todayTx.filter(t => t.staffCommissions).reduce((sum, t) => sum + Object.values(t
                        .staffCommissions).reduce((s, st) => s + (st.commission || 0), 0), 0);
                    response = `📊 **Today's Sales Summary**\n\n• Total Sales: ₱${total.toFixed(2)}\n• Transactions: ${count}\n• Average per Transaction: ₱${avg.toFixed(2)}\n• Staff Commission: ₱${commissions.toFixed(2)}\n\n${count > 0 ? '✅ Activity is healthy today!' : '⚠️ No transactions recorded today yet.'}`;
                } else if (q.includes('week') && (q.includes('sales') || q.includes('revenue') || q.includes(
                        'transaction'))) {
                    const weekStart = getCurrentWeekStart();
                    const weekStartStr = weekStart.toISOString().slice(0, 10);
                    const weekEndStr = getCurrentWeekEnd().toISOString().slice(0, 10);
                    const weekTx = appData.transactions.filter(t => t.date >= weekStartStr && t.date <= weekEndStr);
                    const total = weekTx.reduce((s, t) => s + t.total, 0);
                    const count = weekTx.length;
                    const avg = count > 0 ? total / count : 0;
                    const weeklyData = getWeeklyCommission();
                    const commissions = weeklyData.totals?.commission || 0;
                    const weekLabel = getWeekLabel(new Date());
                    response =
                        `📈 **Weekly Sales Summary**\n\n${weekLabel}\n• Total Sales: ₱${total.toFixed(2)}\n• Transactions: ${count}\n• Average per Transaction: ₱${avg.toFixed(2)}\n• Staff Commission: ₱${commissions.toFixed(2)}\n\n📊 ${count > 0 ? 'This week is active!' : 'No transactions this week yet.'}`;
                } else if (q.includes('month') && (q.includes('sales') || q.includes('revenue') || q.includes(
                        'transaction'))) {
                    const now = new Date();
                    const month = now.getMonth();
                    const year = now.getFullYear();
                    const monthTx = appData.transactions.filter(t => {
                        const d = new Date(t.date);
                        return d.getMonth() === month && d.getFullYear() === year;
                    });
                    const total = monthTx.reduce((s, t) => s + t.total, 0);
                    const count = monthTx.length;
                    const monthName = now.toLocaleString('default', { month: 'long' });
                    response =
                        `📊 **Monthly Sales Summary**\n\n${monthName} ${year}\n• Total Sales: ₱${total.toFixed(2)}\n• Transactions: ${count}\n• ${count > 0 ? `Average: ₱${(total/count).toFixed(2)}` : 'No transactions yet.'}`;
                } else if (q.includes('staff') || q.includes('employee') || q.includes('top')) {
                    if (q.includes('top') || q.includes('best') || q.includes('performing')) {
                        const staffData = appData.staff.map(s => ({
                            name: s.name,
                            commission: s.totalCommission || 0,
                            jobs: s.jobsCompleted || 0,
                            sales: s.salesGenerated || 0
                        }));
                        staffData.sort((a, b) => b.commission - a.commission);
                        const top = staffData.slice(0, 3);
                        if (top.length === 0) {
                            response = '👤 No staff data available yet.';
                        } else {
                            response =
                                `🏆 **Top Performing Staff**\n\n${top.map((s, i) => `${i+1}. **${s.name}** — ₱${s.commission.toFixed(2)} commission, ${s.jobs} jobs, ₱${s.sales.toFixed(2)} sales`).join('\n')}\n\n💡 Total Staff: ${appData.staff.length}`;
                        }
                    } else if (q.includes('total')) {
                        const totalCommission = appData.staff.reduce((sum, s) => sum + (s.totalCommission || 0), 0);
                        const totalJobs = appData.staff.reduce((sum, s) => sum + (s.jobsCompleted || 0), 0);
                        const totalSales = appData.staff.reduce((sum, s) => sum + (s.salesGenerated || 0), 0);
                        response =
                            `👥 **Staff Overview**\n\n• Total Staff: ${appData.staff.length}\n• Total Commission: ₱${totalCommission.toFixed(2)}\n• Total Jobs: ${totalJobs}\n• Total Sales Generated: ₱${totalSales.toFixed(2)}`;
                    } else {
                        const staffList = appData.staff.map(s =>
                            `• ${s.name} — ${s.position || 'Staff'} | ₱${(s.totalCommission||0).toFixed(2)} commission | ${s.jobsCompleted||0} jobs`
                            ).join('\n');
                        response =
                            `👤 **Staff Members**\n\n${staffList || 'No staff members added yet.'}\n\n💡 Ask about top performers or total stats.`;
                    }
                } else if (q.includes('find') || q.includes('search') || q.includes('look') || q.includes('transaction')) {
                    const words = q.split(' ');
                    let searchTerm = '';
                    for (const word of words) {
                        if (word.startsWith('inv-') || word.startsWith('INV-') || word.length > 5) {
                            searchTerm = word;
                            break;
                        }
                    }
                    if (!searchTerm) {
                        const customers = appData.customers.map(c => c.name.toLowerCase());
                        for (const word of words) {
                            if (word.length > 3 && customers.some(c => c.includes(word))) {
                                searchTerm = word;
                                break;
                            }
                        }
                    }
                    if (searchTerm) {
                        const foundTx = appData.transactions.filter(t =>
                            t.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            (t.customer && t.customer.toLowerCase().includes(searchTerm.toLowerCase()))
                        );
                        if (foundTx.length > 0) {
                            const recent = foundTx.slice(0, 5);
                            response =
                                `🔍 **Found ${foundTx.length} transaction(s)** for "${searchTerm}"\n\n${recent.map(t => `• ${t.id} — ${t.customer} — ₱${t.total.toFixed(2)} — ${new Date(t.date).toLocaleDateString()}`).join('\n')}\n\n${foundTx.length > 5 ? `... and ${foundTx.length - 5} more` : ''}`;
                        } else {
                            response =
                                `🔍 No transactions found for "${searchTerm}". Try a receipt number like INV-2024-000123 or customer name.`;
                        }
                    } else {
                        response =
                            `🔍 **Search Help**\n\nI can search for transactions by:\n• Receipt number (e.g., INV-2024-000123)\n• Customer name\n• Vehicle plate number\n\nTry: "Find transaction INV-2024-000123" or "Search customer Juan"`;
                    }
                } else if (q.includes('customer') || q.includes('buyer') || q.includes('client')) {
                    const totalCustomers = appData.customers.length;
                    const totalSpent = appData.customers.reduce((sum, c) => {
                        const tx = appData.transactions.filter(t => t.customer === c.name);
                        return sum + tx.reduce((s, t) => s + t.total, 0);
                    }, 0);
                    const avgSpent = totalCustomers > 0 ? totalSpent / totalCustomers : 0;
                    const topCustomers = appData.customers.map(c => {
                        const tx = appData.transactions.filter(t => t.customer === c.name);
                        const spent = tx.reduce((s, t) => s + t.total, 0);
                        return { name: c.name, spent, visits: tx.length };
                    }).sort((a, b) => b.spent - a.spent).slice(0, 5);
                    response =
                        `👤 **Customer Overview**\n\n• Total Customers: ${totalCustomers}\n• Total Spending: ₱${totalSpent.toFixed(2)}\n• Average per Customer: ₱${avgSpent.toFixed(2)}\n\n🏆 **Top Customers**\n\n${topCustomers.map((c, i) => `${i+1}. ${c.name} — ₱${c.spent.toFixed(2)} (${c.visits} visits)`).join('\n')}`;
                } else if (q.includes('commission')) {
                    const weeklyData = getWeeklyCommission();
                    const totalComm = appData.staff.reduce((sum, s) => sum + (s.totalCommission || 0), 0);
                    const weeklyComm = weeklyData.totals?.commission || 0;
                    const topStaff = appData.staff.sort((a, b) => (b.totalCommission || 0) - (a.totalCommission || 0))
                        .slice(0, 3);
                    response =
                        `💰 **Commission Report**\n\n• Total Commission (All Time): ₱${totalComm.toFixed(2)}\n• Weekly Commission: ₱${weeklyComm.toFixed(2)}\n• Staff Count: ${appData.staff.length}\n\n🏆 **Top Earners**\n\n${topStaff.map((s, i) => `${i+1}. ${s.name} — ₱${(s.totalCommission||0).toFixed(2)}`).join('\n')}\n\n💡 Ask about staff performance for more details.`;
                } else if (q.includes('inventory') || q.includes('stock') || q.includes('supply')) {
                    const totalItems = appData.inventory.length;
                    const lowStock = appData.inventory.filter(i => i.quantity <= i.reorderLevel);
                    const lowStockCount = lowStock.length;
                    const totalQuantity = appData.inventory.reduce((sum, i) => sum + i.quantity, 0);
                    response =
                        `📦 **Inventory Overview**\n\n• Total Items: ${totalItems}\n• Total Stock Units: ${totalQuantity}\n• Low Stock Items: ${lowStockCount}\n\n${lowStockCount > 0 ? '⚠️ **Low Stock Alert**\n' + lowStock.map(i => `• ${i.name}: ${i.quantity} ${i.unit} (Reorder at ${i.reorderLevel})`).join('\n') : '✅ All items are well-stocked.'}\n\n💡 Ask about a specific item by name.`;
                } else if (q.includes('service') || q.includes('wash') || q.includes('detail')) {
                    const serviceCount = {};
                    appData.transactions.forEach(t => {
                        t.items.forEach(item => {
                            serviceCount[item.serviceName] = (serviceCount[item.serviceName] || 0) + item
                                .quantity;
                        });

                    const topServices = Object.entries(serviceCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
                    const totalServices = appData.services.length;
                    response =
                        `🧼 **Service Overview**\n\n• Total Services Offered: ${totalServices}\n• Most Popular Services:\n\n${topServices.map(([name, count], i) => `${i+1}. ${name} — ${count} times`).join('\n')}\n\n💡 Ask about specific service prices or details.`;

                    response =
                        `🤖 **AI Assistant Help**\n\nI can help you with:\n\n📊 **Sales & Revenue**\n• Today/Week/Month sales\n• Transaction analysis\n\n👤 **Staff**\n• Performance reports\n• Top earners\n• Staff list\n\n💰 **Commissions**\n• Total commission\n• Weekly breakdown\n\n👥 **Customers**\n• Customer overview\n• Top customers\n• Customer search\n\n📦 **Inventory**\n• Stock levels\n• Low stock alerts\n• Item search\n\n🧼 **Services**\n• Popular services\n• Service details\n\n🔍 **Search**\n• Find transactions by receipt, customer, or plate\n• Search staff, customers, or inventory\n\nJust ask in plain English!`;

        function renderAdminServices() {

            ${appData.services.map(s => `<tr class="border-b border-gray-700"><td class="py-2 editable-field cursor-pointer" onclick="editServiceName(${s.id})">${s.name}</td><td><span class="category-badge">${s.category}</span></td><td class="text-xs">${s.sizes.join(', ')}</td><td class="text-xs">${Object.entries(s.prices).map(([k,v])=>`${k}:₱${v}`).join(' ')}</td><td><button onclick="toggleServiceStatus(${s.id})" class="text-${s.isActive !== false ? 'green' : 'red'}-400">${s.isActive !== false ? 'Active' : 'Inactive'}</button></td><td><button onclick="editServicePrice(${s.id})" class="text-cyan-400 mr-2"><i class="fas fa-edit"></i></button><button onclick="deleteServiceItem(${s.id})" class="text-red-400"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
        }

        window.showAddServiceModal = () => {
            const categoryOptions = appData.categories.map(c => `<option>${c}</option>`).join('');
            let modalHtml = `<div id="adminModal" class="modal"><div class="modal-content"><h3 class="text-xl font-bold mb-4">Add New Service</h3><div class="space-y-3"><div><label class="text-gray-400">Service Name</label><input type="text" id="newServiceName" class="w-full bg-gray-800 p-2 rounded"></div><div><label class="text-gray-400">Description</label><input type="text" id="newServiceDesc" class="w-full bg-gray-800 p-2 rounded"></div><div><label class="text-gray-400">Category</label><select id="newServiceCat" class="w-full bg-gray-800 p-2 rounded">${categoryOptions}</select></div><div><label class="text-gray-400">Sizes (comma separated)</label><input type="text" id="newServiceSizes" class="w-full bg-gray-800 p-2 rounded" placeholder="Small, Medium, Large"></div><div><label class="text-gray-400">Prices (comma separated matching sizes)</label><input type="text" id="newServicePrices" class="w-full bg-gray-800 p-2 rounded" placeholder="200, 230, 250"></div><div class="flex gap-3"><button onclick="confirmAddService()" class="btn-neon flex-1 p-2 rounded">Create</button><button onclick="closeAdminModal()" class="bg-gray-700 flex-1 p-2 rounded">Cancel</button></div></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };
        window.confirmAddService = () => {
            const name = document.getElementById('newServiceName')?.value;
            if (!name) { alert("Name required!"); return; }
            const desc = document.getElementById('newServiceDesc')?.value || "";
            const category = document.getElementById('newServiceCat')?.value || "Specialty";
            const sizes = document.getElementById('newServiceSizes')?.value.split(',').map(s => s.trim());
            const pricesArr = document.getElementById('newServicePrices')?.value.split(',').map(p => parseFloat(p.trim()));
            const prices = {};
            sizes.forEach((size, idx) => { if (pricesArr[idx]) prices[size] = pricesArr[idx]; });
            const newService = { id: Date.now(), name: name.toUpperCase(), desc, sizes, prices, category,
            isActive: true };
            appData.services.push(newService);
            sizes.forEach(size => {
                const price = prices[size];
                if (price) {
                    const tier30 = Math.round(price * 0.26);
                    const tier35 = Math.round(price * 0.30);
                    const tier40 = Math.round(price * 0.35);
                    const key = `${name.toUpperCase()}_${size}`;
                    appData.commissionMatrix[key] = [tier30, tier35, tier40];
                }
            });
            saveToLocal();
            closeAdminModal();
            renderApp();
            alert(`✅ Service "${name}" added!`);
        };

        window.editServiceName = (id) => {
            let s = appData.services.find(s => s.id === id);
            if (s) {
                let newName = prompt("New name:", s.name);
                if (newName) {
                    const oldName = s.name;
                    s.name = newName.toUpperCase();
                    const newMatrix = {};
                    Object.keys(appData.commissionMatrix).forEach(key => {
                        if (key.startsWith(oldName)) {
                            const newKey = key.replace(oldName, s.name);
                            newMatrix[newKey] = appData.commissionMatrix[key];
                        } else {
                            newMatrix[key] = appData.commissionMatrix[key];
                        }
                    });
                    appData.commissionMatrix = newMatrix;
                    saveToLocal();
                    renderApp();
                }
            }
        };
        window.editServicePrice = (id) => {
            let s = appData.services.find(s => s.id === id);
            if (s) {
                let size = prompt("Size to edit:", s.sizes[0]);
                let price = parseFloat(prompt("New price:"));
                if (size && price) {
                    s.prices[size] = price;
                    const key = `${s.name}_${size}`;
                    const tier30 = Math.round(price * 0.26);
                    const tier35 = Math.round(price * 0.30);
                    const tier40 = Math.round(price * 0.35);
                    appData.commissionMatrix[key] = [tier30, tier35, tier40];
                    saveToLocal();
                    renderApp();
                }
            }
        };
        window.toggleServiceStatus = (id) => {
            let s = appData.services.find(s => s.id === id);
            if (s) {
                s.isActive = !s.isActive;
                saveToLocal();
                renderApp();
            }
        };
        window.deleteServiceItem = (id) => {
            if (confirm("Delete this service?")) {
                const service = appData.services.find(s => s.id === id);
                if (service) {
                    Object.keys(appData.commissionMatrix).forEach(key => {
                        if (key.startsWith(service.name)) {
                            delete appData.commissionMatrix[key];
                        }
                    });
                    appData.services = appData.services.filter(s => s.id !== id);
                    saveToLocal();
                    renderApp();
                }
            }
        };

        window.showAddCategoryModal = () => {
            let modalHtml = `<div id="adminModal" class="modal"><div class="modal-content"><h3 class="text-xl font-bold mb-4">Add New Category</h3><div class="space-y-3"><div><label class="text-gray-400">Category Name</label><input type="text" id="newCategoryName" class="w-full bg-gray-800 p-2 rounded" placeholder="e.g., Interior Services"></div><div class="flex gap-3 mt-4"><button onclick="confirmAddCategory()" class="btn-neon flex-1 p-2 rounded">Add Category</button><button onclick="closeAdminModal()" class="bg-gray-700 flex-1 p-2 rounded">Cancel</button></div></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };
        window.confirmAddCategory = () => {
            const name = document.getElementById('newCategoryName')?.value?.trim();
            if (!name) { alert("Category name required!"); return; }
            if (appData.categories.includes(name)) { alert("Category already exists!"); return; }
            appData.categories.push(name);
            saveToLocal();
            closeAdminModal();
            renderApp();
            alert(`Category "${name}" added!`);
        };
        window.editCategory = (oldName) => {
            const newName = prompt("Edit category name:", oldName);
            if (newName && newName.trim() && newName !== oldName) {
                if (appData.categories.includes(newName.trim())) { alert("Category already exists!"); return; }
                const idx = appData.categories.indexOf(oldName);
                if (idx !== -1) {
                    appData.categories[idx] = newName.trim();
                    appData.services.forEach(s => { if (s.category === oldName) s.category = newName.trim(); });
                    saveToLocal();
                    renderApp();
                    alert(`Category updated to "${newName}"!`);
                }
            }
        };
        window.deleteCategory = (cat) => {
            if (confirm(`Delete category "${cat}"?`)) {
                appData.categories = appData.categories.filter(c => c !== cat);
                appData.services.forEach(s => { if (s.category === cat) s.category = "Specialty"; });
                saveToLocal();
                renderApp();
            }
        };

                return `<div class="card-premium p-8 text-center"><i class="fas fa-lock text-4xl text-red-400 mb-4"></i><p class="text-xl">Access Denied. Manager or Owner required.</p></div>`;

            let unit = prompt("Unit:") || "Pieces";

                supplier: "" });

            renderApp();

        window.editInventory = (id) => {
            let item = appData.inventory.find(i => i.id === id);
            if (item) {
                item.name = prompt("Item name:", item.name) || item.name;
                item.quantity = parseInt(prompt("Quantity:", item.quantity)) || item.quantity;
                item.reorderLevel = parseInt(prompt("Reorder level:", item.reorderLevel)) || item.reorderLevel;
                saveToLocal();
                renderApp();
            }

                renderApp(); } };

        function generateExcel(data, columns, title, filename) {
            try {
                const wsData = [];
                const headers = columns.map(c => c.header);
                wsData.push(headers);
                data.forEach(row => {
                    const rowData = columns.map(c => row[c.key] !== undefined ? row[c.key] : '');
                    wsData.push(rowData);
                });
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                XLSX.writeFile(wb, `${filename}_${new Date().toISOString().slice(0, 10)}.xlsx`);
                alert(`✅ ${title} exported to Excel!`);
            } catch (e) {
                alert('Error exporting Excel: ' + e.message);
            }
        }

        function generatePDF(data, columns, title, filename, logo = null, logoSize = 80) {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                let y = 10;
                if (logo) {
                    try {
                        doc.addImage(logo, 'JPEG', pageWidth / 2 - 20, y, 40, 20);
                        y += 25;
                    } catch (e) {}
                }
                doc.setFontSize(16);
                doc.text(title, pageWidth / 2, y, { align: 'center' });
                y += 8;
                doc.setFontSize(10);
                doc.text(`Generated: ${new Date().toLocaleString()}`, pageWidth / 2, y, { align: 'center' });
                y += 6;
                doc.text(appData.systemSettings.companyName, pageWidth / 2, y, { align: 'center' });
                y += 10;
                const tableData = data.map(row => columns.map(col => row[col.key] !== undefined ? row[col.key] : ''));
                doc.autoTable({
                    head: [columns.map(c => c.header)],
                    body: tableData,
                    startY: y,
                    styles: { fontSize: 7, cellPadding: 2 },
                    headStyles: { fillColor: [0, 180, 216], textColor: [255, 255, 255], fontSize: 8 },
                    alternateRowStyles: { fillColor: [240, 240, 240] },
                    margin: { left: 5, right: 5 },
                    didDrawPage: function(data) {
                        doc.setFontSize(6);
                        doc.text(`Page ${doc.internal.getNumberOfPages()}`, pageWidth - 10, doc.internal.pageSize
                            .getHeight() - 5, { align: 'right' });
                    }
                });
                doc.save(`${filename}_${new Date().toISOString().slice(0, 10)}.pdf`);
                alert(`✅ ${title} exported to PDF!`);
            } catch (e) {
                alert('Error exporting PDF: ' + e.message);
            }
        }

        function generateCSV(data, columns, filename) {
            try {
                const headers = columns.map(c => c.header).join(',');
                const rows = data.map(row => {
                    return columns.map(col => {
                        let val = row[col.key] !== undefined ? row[col.key] : '';
                        if (typeof val === 'string' && val.includes(',')) val = `"${val}"`;
                        return val;
                    }).join(',');
                });
                const csv = [headers, ...rows].join('\n');
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${filename}_${new Date().toISOString().slice(0, 10)}.csv`;
                a.click();
                alert('✅ CSV exported!');
            } catch (e) {
                alert('Error exporting CSV: ' + e.message);
            }
        }

        window.scanBluetoothDevices = function() {
            const bt = appData.systemSettings.bluetooth;
            if (!bt.enabled) { alert('⚠️ Please enable Bluetooth first.'); return; }
            if (!navigator.bluetooth) { alert('❌ Web Bluetooth API not supported. Use Chrome, Edge, or Opera.'); return; }
            alert('🔍 Scanning for Bluetooth devices...');
            navigator.bluetooth.requestDevice({
                filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }],
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
            }).then(device => {
                const bt = appData.systemSettings.bluetooth;
                bt.deviceName = device.name || 'Unknown Device';
                bt.deviceAddress = device.id || 'N/A';
                bt.paired = true;
                saveToLocal();
                addActivityLog('Bluetooth Device Scanned', `Found: ${bt.deviceName}`);
                renderApp();
                alert(`✅ Found and paired with: ${bt.deviceName}`);
            }).catch(error => {
                alert(`❌ Scan failed: ${error.message || 'No device found.'}`);
            });
        };

        window.pairBluetoothDevice = function() {
            const bt = appData.systemSettings.bluetooth;
            if (!bt.enabled) { alert('⚠️ Please enable Bluetooth first.'); return; }
            if (!navigator.bluetooth) { alert('❌ Web Bluetooth API not supported.'); return; }
            alert('🔗 Please select your Bluetooth printer...');
            navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: '' }],
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
            }).then(device => {
                return device.gatt.connect().then(server => {
                    const bt = appData.systemSettings.bluetooth;
                    bt.deviceName = device.name || 'Unknown Device';
                    bt.deviceAddress = device.id || 'N/A';
                    bt.paired = true;
                    saveToLocal();
                    addActivityLog('Bluetooth Paired', `Paired with: ${bt.deviceName}`);
                    renderApp();
                    alert(`✅ Successfully paired with: ${bt.deviceName}`);
                    return server.disconnect();
                });
            }).catch(error => {
                alert(`❌ Pairing failed: ${error.message || 'Could not pair with device.'}`);
            });
        };

        window.toggleBluetoothAutoPrint = function(checked) {
            const bt = appData.systemSettings.bluetooth;
            bt.autoPrint = checked;
            saveToLocal();
            addActivityLog('Bluetooth Auto-Print', `Auto-Print ${checked ? 'ON' : 'OFF'}`);
            renderApp();
            alert(`🔵 Bluetooth Auto-Print ${checked ? 'enabled' : 'disabled'}.`);
        };

        window.testBluetoothPrint = function() {
            const bt = appData.systemSettings.bluetooth;
            if (!bt.enabled) { alert('⚠️ Please enable Bluetooth first.'); return; }
            if (!bt.paired) { alert('⚠️ Please pair a Bluetooth device first.'); return; }
            if (!navigator.bluetooth) { alert('❌ Web Bluetooth API not supported.'); return; }
            alert(`🖨️ Sending test print to ${bt.deviceName}...`);

            const testContent = `
                ${appData.systemSettings.companyName}
                ${'='.repeat(32)}
                TEST PRINT
                ${'-'.repeat(32)}
                Date: ${new Date().toLocaleString()}
                Device: ${bt.deviceName}
                ${'-'.repeat(32)}
                Bluetooth: OK
                ${'='.repeat(32)}
                ✅ Test Successful!
                ${'-'.repeat(32)}
            `;

            navigator.bluetooth.requestDevice({
                filters: [{ name: bt.deviceName }]
            }).then(device => {
                return device.gatt.connect().then(server => {
                    return server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                }).then(service => {
                    return service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                }).then(characteristic => {
                    const encoder = new TextEncoder();
                    const data = encoder.encode(testContent + '\n\n');
                    return characteristic.writeValue(data);
                }).then(() => {
                    bt.printAttempts = (bt.printAttempts || 0) + 1;
                    bt.printSuccess = (bt.printSuccess || 0) + 1;
                    bt.lastPrint = new Date().toISOString();
                    saveToLocal();
                    renderApp();
                    alert('✅ Test print sent successfully!');
                }).catch(err => {
                    bt.printAttempts = (bt.printAttempts || 0) + 1;
                    saveToLocal();
                    throw err;
                });
            }).catch(error => {
                bt.printAttempts = (bt.printAttempts || 0) + 1;
                saveToLocal();
                renderApp();
                alert(`❌ Test print failed: ${error.message || 'Could not send print job.'}`);
            });
        };
